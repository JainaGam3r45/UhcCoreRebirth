plugins {
	id "base"
	id "xyz.jpenilla.run-paper" version "3.0.1"
	id "net.kyori.indra.git" version "3.2.0"
	id "com.gradleup.shadow" version "9.2.2" apply false
}

group = "io.github.jainagam3r45"
version = "1.22.2"

tasks.register("copyArtifacts", Copy) {
	from(project(":uhccore-legacy").tasks.named("shadowJar"))
	from(project(":uhccore-modern").tasks.named("shadowJar"))
	into(layout.buildDirectory.dir("libs"))
}

tasks.named("assemble") {
	dependsOn(project(":uhccore-legacy").tasks.named("shadowJar"))
	dependsOn(project(":uhccore-modern").tasks.named("shadowJar"))
	finalizedBy("copyArtifacts")
}

tasks.named("build") {
	dependsOn(tasks.named("assemble"))
}

tasks.named("runServer") {
	def mcVersion = project.findProperty("mcVersion") ?: "1.21.4"
	minecraftVersion mcVersion
	runDirectory rootProject.file("run/$mcVersion")
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(getJavaVersionFor(mcVersion))
	}
	jvmArgs += [ "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005" ]
}

int getJavaVersionFor(String mcVersion) {
	String[] versionNumbers = mcVersion.split("\\.")
	if (versionNumbers.length < 2) {
		return 21
	}
	int majorVersion = Integer.parseInt(versionNumbers[0])
	int minorVersion = Integer.parseInt(versionNumbers[1])
	int patchVersion = versionNumbers.length >= 3 ? Integer.parseInt(versionNumbers[2]) : 0

	if (majorVersion >= 26) {
		return minorVersion >= 4 ? 25 : 21
	}

	switch (minorVersion) {
		case 8..16: return 8
		case 17: return 16
		case 18..19: return 17
		case 20: return patchVersion <= 4 ? 17 : 21
		default: return 21
	}
}

boolean isSnapshot() {
	return project.version.endsWith("-SNAPSHOT")
}

String getPluginVersion() {
	def commit = indraGit.commit()
	if (commit != null && isSnapshot()) {
		return project.version + "-" + commit.getName()
	} else {
		return project.version
	}
}
