plugins {
	id "java-library"
}

repositories {
	mavenCentral()
	maven {
		name = "spigotmc"
		url = "https://hub.spigotmc.org/nexus/content/groups/public/"
		content {
			includeGroup "org.bukkit"
			includeGroup "org.spigotmc"
			includeGroup "net.md-5"
		}
	}
	maven {
		name = "papermc"
		url = "https://repo.papermc.io/repository/maven-public/"
		content {
			includeGroup "io.papermc"
		}
	}
	maven {
		name = "jitpack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.MilkBowl"
		}
	}
	maven {
		name = "codemc"
		url = "https://repo.codemc.io/repository/maven-snapshots/"
		content {
			includeGroup "net.wesjd"
		}
	}
	maven {
		name = "placeholderapi"
		url = "https://repo.extendedclip.com/releases/"
		content {
			includeGroup "me.clip"
		}
	}
	flatDir {
		dirs "$rootDir/libs"
	}
}

dependencies {
	compileOnly "org.spigotmc:spigot-api:1.15.2-R0.1-SNAPSHOT"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.github.MilkBowl:VaultAPI:1.7"
	compileOnly "me.clip:placeholderapi:2.11.5"
	compileOnly "net.dmulloy2:ProtocolLib:5.3.0"
	api "net.wesjd:anvilgui:1.10.10-SNAPSHOT"
	api "io.papermc:paperlib:1.0.8"
	api project(":Support-WorldEdit-6")
	api project(":Support-WorldEdit-7")
	api project(":version-adapters")
	api ":BiomeMapping-1.3"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
}

processResources {
	def props = [
		"pluginVersion": rootProject.version.toString()
	]
	inputs.properties(props)
	filesMatching("plugin.yml") {
		expand(props)
	}
}
